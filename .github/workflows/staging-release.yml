name: staging-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release tag, for example v1.14.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging-ct102-parity
    steps:
      - name: Validate immutable version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.STAGING_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy the same versioned images and run guarded smoke
        env:
          VERSION: ${{ inputs.version }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          set -euo pipefail
          ssh "${STAGING_USER}@${STAGING_HOST}" \
            "cd '${STAGING_PATH}' && bash hostgator-setup-kit/release-safe.sh --to '${VERSION}'"
