plugins { id 'com.android.application' }
android {
    namespace 'com.fieldcrm.sales'
    compileSdk 35
    defaultConfig { applicationId 'com.fieldcrm.sales'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0-pilot'; testInstrumentationRunner 'com.fieldcrm.sales.SmokeInstrumentation'; buildConfigField 'String', 'CRM_BASE_URL', '"https://crm.techspothub.com"' }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
