name: android

on:
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]
  push:
    branches: [main, codex/field-sales-tracking, codex/ct102-release-speed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.2"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit, lint and APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.2"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache emulator snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-x86_64-v1
      - name: Create emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot ready"
      - name: Fresh-install instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile/android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
